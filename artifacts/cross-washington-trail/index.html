const COND = {
  good:   {label: 'Good',        v: '--c-good'},
  fair:   {label: 'Fair',        v: '--c-fair'},
  rough:  {label: 'Rough',       v: '--c-rough'},
  closed: {label: 'Closed',      v: '--c-closed'},
  detour: {label: 'Road detour', v: '--c-road'},
  road:   {label: 'On road',     v: '--c-road'},
  ferry:  {label: 'Ferry',       v: '--c-ferry'}
};
const ACCESS = {
  trail: {label: 'Trail-only (bike or walk in)', short: 'Trail-only', v: '--p-trail', glyph: '⛺'},
  hb:    {label: 'Drive-in with hiker/biker sites', short: 'Hiker/biker sites', v: '--p-hb', glyph: '🚲'},
  drive: {label: 'Drive-in campground', short: 'Drive-in', v: '--p-drive', glyph: '🚗'}
};
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dash = v => (v == null || v === '' || v === 'unknown') ? '—' : esc(v);
const css = v => getComputedStyle(document.querySelector('.viz-root')).getPropertyValue(v).trim();
const mapsUrl = c => 'https://www.google.com/maps/search/?api=1&query=' + c.lat + ',' + c.lon;

const allCamps = DATA.sections.flatMap(s => s.camps);
const allSegs = DATA.sections.flatMap(s => s.segments);

document.getElementById('sub').innerHTML =
  'Pacific Ocean at <b>La Push</b> → Olympic Discovery Trail → Puget Sound → Palouse to Cascades State Park Trail → <b>Idaho border</b>. ' +
  'Conditions and camp details checked <b>' + esc(DATA.asof) + '</b>.';
document.getElementById('stats').innerHTML = [
  [Math.round(DATA.total), 'route miles'],
  [allSegs.length, 'segments'],
  [allCamps.length, 'camps'],
  [allCamps.filter(c => c.atype === 'trail').length, 'trail-only camps']
].map(([n, l]) => '<div class="stat"><b>' + n + '</b>' + l + '</div>').join('');

document.getElementById('legend').innerHTML =
  ['good', 'fair', 'rough', 'closed'].filter(k => allSegs.some(s => s.cond === k)).map(k =>
    '<span class="k"><span class="sw" style="border-color:var(' + COND[k].v + ')"></span>' + COND[k].label + '</span>').join('') +
  '<span class="k"><span class="sw dash" style="border-color:var(--c-road)"></span>On road / detour</span>' +
  '<span class="k"><span class="sw dot" style="border-color:var(--c-ferry)"></span>Ferry</span>';

const map = L.map('map', {scrollWheelZoom: false});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18, referrerPolicy: 'strict-origin-when-cross-origin', attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);
map.on('click', () => map.scrollWheelZoom.enable());

const segLayers = [];
const bounds = L.latLngBounds([]);
allSegs.forEach((s, i) => {
  const g = L.featureGroup();
  s.lines.forEach(l => {
    const ferry = s.cond === 'ferry';
    const road = l.gap || s.cond === 'detour' || s.cond === 'road';
    const color = css(ferry ? '--c-ferry' : (road && (s.cond === 'good' || s.cond === 'fair') ? '--c-road' : COND[s.cond].v));
    L.polyline(l.coords, {color: css('--casing'), weight: 7, opacity: 0.9, interactive: false}).addTo(g);
    L.polyline(l.coords, {color, weight: 4, opacity: 1, dashArray: ferry ? '2 8' : (road ? '8 7' : null)}).addTo(g);
    l.coords.forEach(c => bounds.extend(c));
  });
  g.bindPopup(segPopup(s), {maxWidth: 320});
  g.addTo(map);
  segLayers[i] = g;
  s._i = i;
});
map.fitBounds(bounds, {padding: [18, 18]});

function segPopup(s) {
  return '<div class="pop"><h3>' + esc(s.name) + '</h3>' +
    '<div class="meta">Mile ' + Math.round(s.m0) + '–' + Math.round(s.m1) + ' · ' + (s.m1 - s.m0).toFixed(0) + ' mi</div>' +
    '<span class="badge b-' + s.cond + '">' + COND[s.cond].label + '</span>' +
    '<dl><dt>Surface</dt><dd>' + dash(s.surface) + '</dd>' +
    (s.closures ? '<dt>Closures</dt><dd>' + esc(s.closures) + '</dd>' : '') +
    (s.water ? '<dt>Water</dt><dd>' + esc(s.water) + '</dd>' : '') + '</dl>' +
    (s.notes ? '<div class="note">' + esc(s.notes) + '</div>' : '') + '</div>';
}
function campPopup(c) {
  const a = ACCESS[c.atype];
  return '<div class="pop"><h3>' + (c.url ? '<a href="' + esc(c.url) + '" target="_blank" rel="noopener">' + esc(c.name) + '</a>' : esc(c.name)) + '</h3>' +
    '<div class="meta">Mile ' + Math.round(c.mile) + (c.off >= 0.3 ? ' · ' + c.off.toFixed(1) + ' mi off route' : ' · on the trail') + (c.approx ? ' · pin approximate' : '') + '</div>' +
    '<span class="badge a-' + c.atype + '">' + a.short + '</span>' +
    '<dl><dt>Access</dt><dd>' + dash(c.access) + '</dd>' +
    '<dt>Sites</dt><dd>' + dash(c.sites) + '</dd>' +
    '<dt>Toilets</dt><dd>' + dash(c.toilets) + '</dd>' +
    '<dt>Water</dt><dd>' + dash(c.water) + '</dd>' +
    (c.showers != null ? '<dt>Showers</dt><dd>' + (c.showers ? 'Yes' : 'No') + '</dd>' : '') +
    '<dt>Reserve</dt><dd>' + dash(c.reservable) + '</dd>' +
    '<dt>Fee</dt><dd>' + dash(c.fee) + '</dd>' +
    '<dt>Season</dt><dd>' + dash(c.season) + '</dd>' +
    '<dt>Run by</dt><dd>' + dash(c.operator) + '</dd></dl>' +
    (c.notes ? '<div class="note">' + esc(c.notes) + '</div>' : '') +
    '<div class="note"><a href="' + mapsUrl(c) + '" target="_blank" rel="noopener">Open in Google Maps</a></div></div>';
}

const campLayers = {trail: L.layerGroup().addTo(map), hb: L.layerGroup().addTo(map), drive: L.layerGroup().addTo(map)};
allCamps.forEach((c, i) => {
  const a = ACCESS[c.atype];
  const icon = L.divIcon({className: '', iconSize: [24, 24], iconAnchor: [12, 12], popupAnchor: [0, -10],
    html: '<div class="pin' + (c.approx ? ' approx' : '') + '" style="background:var(' + a.v + ')">' + a.glyph + '</div>'});
  c._m = L.marker([c.lat, c.lon], {icon, title: c.name, zIndexOffset: c.atype === 'trail' ? 500 : 0})
    .bindPopup(campPopup(c), {maxWidth: 320}).addTo(campLayers[c.atype]);
  c._i = i;
});

document.getElementById('chips').innerHTML = Object.entries(ACCESS).map(([k, a]) =>
  '<button class="chip" data-k="' + k + '"><span class="dot" style="background:var(' + a.v + ')"></span>' + a.label +
  ' · ' + allCamps.filter(c => c.atype === k).length + '</button>').join('');
document.querySelectorAll('.chip').forEach(ch => ch.addEventListener('click', () => {
  const k = ch.dataset.k; const off = ch.classList.toggle('off');
  if (off) map.removeLayer(campLayers[k]); else map.addLayer(campLayers[k]);
  document.querySelectorAll('tr[data-atype="' + k + '"]').forEach(r => r.hidden = off);
}));

document.getElementById('sections').innerHTML = DATA.sections.map(sec =>
  '<section class="leg"><h2>' + esc(sec.name) + '</h2>' +
  '<div class="legmeta">Mile ' + Math.round(sec.m0) + '–' + Math.round(sec.m1) + ' · ' + Math.round(sec.m1 - sec.m0) + ' mi · ' + esc(sec.blurb) + '</div>' +
  '<h3 class="tbl">Trail conditions</h3><div class="scroll"><table><thead><tr><th>Segment</th><th>Mile</th><th>Mi</th><th>Condition</th><th>Surface</th><th>Notes, closures, water</th></tr></thead><tbody>' +
  sec.segments.map(s => '<tr data-seg="' + s._i + '"><td class="nm">' + esc(s.name) + '</td><td class="num">' + Math.round(s.m0) + '–' + Math.round(s.m1) +
    '</td><td class="num">' + Math.round(s.m1 - s.m0) + '</td><td><span class="badge b-' + s.cond + '">' + COND[s.cond].label + '</span></td><td>' + dash(s.surface) +
    '</td><td class="notes">' + (s.closures ? '<b>' + esc(s.closures) + '</b> ' : '') + esc(s.notes || '') + (s.water ? ' <b>Water:</b> ' + esc(s.water) : '') + '</td></tr>').join('') +
  '</tbody></table></div>' +
  (sec.camps.length ? '<h3 class="tbl">Camps</h3><div class="scroll"><table><thead><tr><th>Camp</th><th>Mile</th><th>Off route</th><th>Access</th><th>Sites</th><th>Toilets</th><th>Water</th><th>Reserve</th><th>Fee</th><th>Season</th><th>Notes</th></tr></thead><tbody>' +
  sec.camps.map(c => '<tr data-camp="' + c._i + '" data-atype="' + c.atype + '"><td class="nm">' + (c.url ? '<a href="' + esc(c.url) + '" target="_blank" rel="noopener">' + esc(c.name) + '</a>' : esc(c.name)) +
    '</td><td class="num">' + Math.round(c.mile) + '</td><td class="num">' + (c.off < 0.3 ? 'on trail' : c.off.toFixed(1) + ' mi') +
    '</td><td><span class="badge a-' + c.atype + '">' + ACCESS[c.atype].short + '</span></td><td class="num">' + dash(c.sites) + '</td><td>' + dash(c.toilets) + '</td><td>' + dash(c.water) +
    '</td><td>' + dash(c.reservable) + '</td><td>' + dash(c.fee) + '</td><td>' + dash(c.season) + '</td><td class="notes">' + esc(c.notes || '') + '</td></tr>').join('') +
  '</tbody></table></div>' : '') + '</section>').join('');

document.getElementById('sections').addEventListener('click', e => {
  if (e.target.closest('a')) return;
  const tr = e.target.closest('tr'); if (!tr) return;
  if (tr.dataset.camp != null) {
    const c = allCamps[+tr.dataset.camp];
    if (!map.hasLayer(campLayers[c.atype])) return;
    map.setView([c.lat, c.lon], Math.max(map.getZoom(), 13)); c._m.openPopup();
  } else if (tr.dataset.seg != null) {
    const g = segLayers[+tr.dataset.seg]; map.fitBounds(g.getBounds(), {padding: [30, 30]}); g.openPopup(g.getBounds().getCenter());
  } else return;
  document.getElementById('map').scrollIntoView({behavior: 'smooth', block: 'center'});
});

document.getElementById('rules').innerHTML = '<h2>Camping rules that apply along the way</h2><ul>' +
  DATA.rules.map(r => '<li>' + esc(r) + '</li>').join('') + '</ul>';
document.getElementById('footer').innerHTML =
  'Route line from OpenStreetMap trail relations (Great American Rail-Trail, Olympic Discovery Trail, Palouse to Cascades State Park Trail, Snoqualmie Valley Trail); dashed on-road links are router-drawn and approximate. ' +
  'Mileage is measured along this line from La Push and will differ from official mileposts; off-route distances are straight-line. Conditions change: confirm closures with the managing agency before riding. ' +
  'Dashed pin outline = approximate location.<br>Sources: ' +
  DATA.sources.map(s => '<a href="' + esc(s[1]) + '" target="_blank" rel="noopener">' + esc(s[0]) + '</a>').join(' · ');
</script>
</body>
</html>
